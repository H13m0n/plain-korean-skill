name: 문체 패턴·예외 제안
description: 새 가상 문장으로 수정 방향과 유지할 문맥을 제안합니다.
title: "[패턴 제안] "
body:
  - type: markdown
    attributes:
      value: |
        이 이슈는 공개됩니다. 실제 문서·대화·로그·첨부를 넣지 마세요.
        이름만 지우지 말고 다른 일반 소재와 새 문장으로 예문을 작성하세요.
        사람·조직·프로젝트·제품·환경 정보와 고유한 사건 조합을 포함하지 마세요.
  - type: textarea
    id: context
    attributes:
      label: 패턴과 가상 문맥
      description: 어떤 문체 판단을 다루는지, 새로 만든 일반 상황으로 설명합니다.
    validations:
      required: true
  - type: textarea
    id: before
    attributes:
      label: 수정 전 가상 예문
    validations:
      required: true
  - type: textarea
    id: after
    attributes:
      label: 수정 후 가상 예문
      description: 삭제가 적절하면 문장 삭제라고 적습니다. 유지 사례도 제안할 수 있습니다.
    validations:
      required: true
  - type: textarea
    id: reason
    attributes:
      label: 수정 이유와 유지할 문맥
      description: 왜 고치는지, 같은 표현을 언제 남겨야 하는지 함께 적습니다.
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: 공개 범위 확인
      options:
        - label: 원문을 옮기지 않고 새 가상 예문을 작성했으며 개인·조직·환경 정보와 고유 사건 조합이 없는지 모든 필드를 검토했습니다.
          required: true
        - label: 이 이슈 내용과 GitHub 계정이 공개되며 기여한 내용은 MIT 라이선스로 배포됨을 이해합니다.
          required: true
